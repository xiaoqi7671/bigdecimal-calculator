name: engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch Kotlin compiler
        run: |
          curl -sSL --retry 3 -o kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Engine assertions
        run: |
          kotlinc -version
          kotlinc app/src/main/kotlin/com/xiaoqi/calculator/Calculator.kt \
                  tools/EngineCheck.kt -include-runtime -d check.jar
          java -jar check.jar
